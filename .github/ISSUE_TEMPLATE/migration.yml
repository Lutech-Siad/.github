name: Migration
description: Cambio di versione o di tecnologia (framework, libreria, infrastruttura)
labels: []
body:
  - type: textarea
    id: obiettivo
    attributes:
      label: Obiettivo
      description: Perché esiste questa issue — descrivere la migrazione e il contesto
      placeholder: "Esempio: Migrare il frontend da Angular 10 a Angular 18"
    validations:
      required: true

  - type: input
    id: versione-attuale
    attributes:
      label: Versione attuale
      description: Versione o stack attualmente in uso
      placeholder: "Esempio: Angular 10.2, .NET Framework 4.8"
    validations:
      required: true

  - type: input
    id: versione-target
    attributes:
      label: Versione target
      description: Versione o stack di destinazione
      placeholder: "Esempio: Angular 18, .NET 10"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Cosa va migrato — piano step-by-step
      placeholder: |
        - Analisi impatto e breaking changes
        - Step intermedi (per esempio Angular 10 → 11 → ... → 18)
        - Aggiornamento dipendenze
        - Test di validazione per ogni step
    validations:
      required: true

  - type: textarea
    id: impatto-funzionalita
    attributes:
      label: Impatto su funzionalità esistenti
      description: Quali funzionalità attuali potrebbero essere impattate dalla migrazione (se applicabile)
      placeholder: |
        - Tutti i componenti Angular: refactoring necessario
        - API backend: nessun impatto
        - Build pipeline: aggiornamento Node.js
    validations:
      required: false

  - type: textarea
    id: piano-rollback
    attributes:
      label: Piano di rollback
      description: Come tornare indietro se la migrazione fallisce
      placeholder: |
        - Branch develop resta intatto fino al merge finale
        - Backup database prima del deploy
        - Tornare al tag v<major>.<minor>.<patch> precedente se necessario
    validations:
      required: true

  - type: textarea
    id: riferimenti
    attributes:
      label: Riferimenti
      description: Issue Tracker, JIRA, issue collegate, file del repository, fonti esterne (formato in issues.instructions.md §6)
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: Note
      description: Vincoli temporali, dipendenze, stato
    validations:
      required: false
