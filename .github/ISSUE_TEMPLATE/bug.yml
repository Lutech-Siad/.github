name: Bug
description: Difetto in qualcosa non ancora in produzione, trovato sviluppando o collaudando un lavoro nuovo
labels: []
body:
  - type: textarea
    id: obiettivo
    attributes:
      label: Obiettivo
      description: Perché esiste questa issue — descrivere il difetto riscontrato
      placeholder: "Esempio: L'utente riceve un errore 500 quando salva un'offerta con righe gas miste"
    validations:
      required: true

  - type: textarea
    id: passi-per-riprodurre
    attributes:
      label: Passi per riprodurre
      description: Sequenza di azioni per riprodurre il bug
      placeholder: |
        1. Accedere alla sezione Offerte
        2. Creare una nuova offerta
        3. Aggiungere una riga gas CO2
        4. Cliccare Salva
        5. → Errore 500
    validations:
      required: true

  - type: textarea
    id: comportamento-atteso
    attributes:
      label: Comportamento atteso e attuale
      description: Cosa dovrebbe succedere e cosa succede invece
      placeholder: |
        **Atteso**: L'offerta viene salvata correttamente
        **Attuale**: Errore 500 — NullReferenceException in OfferManager.Save()
    validations:
      required: true

  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      description: In quale ambiente è stato riscontrato il bug
      options:
        - develop
        - dev
        - test
    validations:
      required: true

  - type: textarea
    id: impatto
    attributes:
      label: Impatto
      description: Conseguenze del bug (utenti bloccati, dati inconsistenti, workaround necessario)
      placeholder: "Esempio: Gli utenti non possono salvare offerte con mix gas — workaround: creare righe singole"
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Cosa va fatto per risolvere il bug
      placeholder: |
        - Identificare la causa
        - Correggere il comportamento
        - Aggiungere test di regressione
    validations:
      required: true

  - type: textarea
    id: riferimenti
    attributes:
      label: Riferimenti
      description: Issue Tracker, JIRA, issue collegate, file del repository, fonti esterne (formato in issues.instructions.md §6)
      placeholder: "Esempio: Segnalato in #12, log errore in Application Insights"
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: Note
      description: Vincoli, dipendenze, stato
    validations:
      required: false
