name: Release
description: Rilascio di una nuova versione in produzione (release → main)
labels: []
body:
  - type: textarea
    id: obiettivo
    attributes:
      label: Obiettivo
      description: Perché esiste questa issue — descrivere la versione da rilasciare
      placeholder: "Esempio: Rilasciare in produzione la versione v1.1.0 di nexusq-backend, raccogliendo tutte le feature e fix sviluppati e mergiati su develop."
    validations:
      required: true

  - type: input
    id: versione-target
    attributes:
      label: Versione target
      description: Versione SemVer da rilasciare, con il prefisso v
      placeholder: "v1.1.0"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Passi del processo di release
      value: |
        - Rilasciare con il custom agent `gitflow` secondo la procedura di `git.instructions.md §5` (branch, pull request di release, backmerge)
        - Verificare tag e GitHub Release creati dal workflow dopo il merge
    validations:
      required: true

  - type: textarea
    id: issue-incluse
    attributes:
      label: Issue incluse
      description: Elenco dei numeri delle issue già completate e mergiate su develop che fanno parte di questo rilascio (riferimento, non sub-issue)
      placeholder: |
        - #16 — <titolo della issue>
        - #19 — <titolo della issue>
    validations:
      required: true

  - type: textarea
    id: riferimenti
    attributes:
      label: Riferimenti
      description: Issue Tracker, JIRA, issue collegate, file del repository, fonti esterne (formato in issues.instructions.md §6)
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: Note
      description: Vincoli, dipendenze o rischi noti del rilascio
    validations:
      required: false
