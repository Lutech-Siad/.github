name: Task
description: Attività operativa (configurazione, documentazione, infrastruttura) e tutto ciò che non rientra negli altri tipi
labels: []
body:
  - type: textarea
    id: obiettivo
    attributes:
      label: Obiettivo
      description: Perché esiste questa issue — descrivere l'attività da svolgere
      placeholder: "Esempio: Configurare i secrets di GitHub Actions per il deploy..."
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Cosa va fatto
      placeholder: |
        - Step 1
        - Step 2
        - Verifica
    validations:
      required: true

  - type: textarea
    id: riferimenti
    attributes:
      label: Riferimenti
      description: Issue Tracker, JIRA, issue collegate, file del repository, fonti esterne (formato in issues.instructions.md §6)
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: Note
      description: Vincoli, dipendenze, stato
    validations:
      required: false
